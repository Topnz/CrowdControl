spring.application.name=ingestion-server

# Event-database (PostGIS) – se docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5433/eventdb
spring.datasource.username=crowdcontrol
spring.datasource.password=crowdcontrol

# RabbitMQ – se docker-compose.yml
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=crowdcontrol
spring.rabbitmq.password=crowdcontrol

# Rate limit – mindste tid mellem to positioner fra samme enhed (fx 2s, 500ms)
crowdcontrol.rate-limit.min-interval=1s

# Demo-event – bruges indtil processing-server sender rigtige events
crowdcontrol.demo-event.enabled=true
crowdcontrol.demo-event.id=00000000-0000-0000-0000-000000000001
crowdcontrol.demo-event.send-interval=10s
crowdcontrol.demo-event.duration=30d

# Kø til positioner (Java -> C#), se contracts/asyncapi/messaging.yaml
crowdcontrol.rabbitmq.positions-queue=positions
